<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5fd9">
<title>NeW 111</title>
<meta name="description" content="NeW 111 – a simple word processor. All rights reserved by Gurusaran B.">
<link rel="icon" href="new.png">
<style>
  :root{
    --brand:#3B6645; --brand2:#e8effd;
    --bg:#e9edf3; --panel:#ffffff; --ink:#1d2330; --muted:#6a7487; --line:#d8dee8; --hover:#f0f3f8;
    --page:#ffffff; --pageink:#111;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{--brand:#6f97ff;--brand2:#1b2744;--bg:#10141b;--panel:#181d27;--ink:#e6eaf2;--muted:#8d97ab;--line:#2a3140;--hover:#212837}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);
    font:14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;overscroll-behavior:none}
  button,select,input{font:inherit;color:inherit;touch-action:manipulation}

  /* ================= HEADER ================= */
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .menu{display:none}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.2px;color:var(--brand);white-space:nowrap}
  .brand i{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font-style:normal;display:grid;place-items:center;font-size:14px}
  #title{flex:1 1 160px;min-width:0;max-width:380px;border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 9px;font-weight:600}
  #title:hover{border-color:var(--line)}
  #title:focus{outline:2px solid var(--brand);background:var(--panel)}
  #status{color:var(--muted);font-size:12px;white-space:nowrap}
  header .sp{flex:1 1 0}
  .btn{height:34px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.on{background:var(--brand2);border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}
  .dd{position:relative}
  .dd-menu{display:none;position:absolute;right:0;top:40px;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;
    box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:50}
  .dd.open .dd-menu{display:block}
  .dd-menu button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:transparent;padding:10px 11px;border-radius:6px;cursor:pointer}
  .dd-menu button:hover{background:var(--hover)}
  .dd-menu small{color:var(--muted)}

  /* ================= TOOLBAR ================= */
  #tb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 2px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  #tb button,#tb select{height:32px;min-width:32px;padding:0 8px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer}
  #tb select{border-color:var(--line);background:var(--panel);padding:0 4px;cursor:pointer;color:var(--ink)}
  #tb select option{color:#111;background:#fff}
  #font{width:140px} #size{width:62px} #block{width:112px}
  #tb button:hover{background:var(--hover)}
  #tb button.on{background:var(--brand2);border-color:var(--brand);color:var(--brand)}
  .sep{width:1px;height:20px;background:var(--line);margin:0 5px;flex:none}
  .clr{position:relative;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;cursor:pointer;flex:none}
  .clr:hover{background:var(--hover)}
  .clr .bar{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:var(--c)}
  .clr .ic{margin-bottom:3px}
  .clr input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

  /* ================= LAYOUT ================= */
  main{flex:1;display:flex;min-height:0;position:relative}
  aside{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  aside h4{margin:0;padding:12px 14px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #list{flex:1;overflow-y:auto;padding:0 8px 10px;-webkit-overflow-scrolling:touch}
  .doc{display:flex;align-items:center;gap:6px;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
  .doc:hover{background:var(--hover)}
  .doc.on{background:var(--brand2);color:var(--brand)}
  .doc div{flex:1;min-width:0}
  .doc b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc small{color:var(--muted)}
  .doc .x{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:5px;padding:2px 8px;font-size:18px;line-height:1}
  .doc .x:hover{background:var(--panel);color:#d33}
  #scrim{display:none}

  #canvas{flex:1;overflow:auto;padding:26px 16px 40px;display:flex;justify-content:center;align-items:flex-start;min-width:0;-webkit-overflow-scrolling:touch}
  #page{width:210mm;max-width:100%;min-height:297mm;background:var(--page);color:var(--pageink);padding:22mm 20mm;
    box-shadow:0 2px 18px rgba(0,0,0,.18);outline:none;font:16px/1.6 Georgia,'Times New Roman',serif;word-wrap:break-word;overflow-wrap:anywhere}
  #page:empty::before{content:"Start typing…";color:#9aa3b2}
  .doc-body h1{font-size:2em;margin:.6em 0 .3em;line-height:1.2}
  .doc-body h2{font-size:1.5em;margin:.6em 0 .3em;line-height:1.25}
  .doc-body h3{font-size:1.2em;margin:.6em 0 .3em}
  .doc-body p{margin:0 0 .7em}
  .doc-body blockquote{margin:.8em 0;padding:.2em 1em;border-left:4px solid #b9c3d6;color:#444}
  .doc-body img{max-width:100%;height:auto}
  .doc-body table{border-collapse:collapse;width:100%;margin:.6em 0;table-layout:fixed}
  .doc-body td,.doc-body th{border:1px solid #9aa3b2;padding:6px 8px;vertical-align:top;overflow-wrap:anywhere}
  .doc-body th{background:#eef1f6;font-weight:700;text-align:left}
  .doc-body a{color:#1a5fd0}

  footer{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;align-items:center;padding:6px 14px calc(6px + var(--safe-b));background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  footer b{color:var(--ink)}
  #status2{display:none}

  #toast{position:fixed;left:50%;bottom:calc(60px + var(--safe-b));transform:translate(-50%,16px);background:#111;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:92vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ================= CALCULATOR ================= */
  #calc{display:none;position:fixed;left:0;top:0;z-index:70;width:min(300px,calc(100vw - 16px));max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;outline:none;user-select:none;-webkit-user-select:none}
  #calc.open{display:flex;flex-direction:column}
  #calcHead{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;background:var(--brand);color:#fff;cursor:grab;touch-action:none;font-weight:600}
  #calcHead.drag{cursor:grabbing}
  #calcHead span{flex:1;letter-spacing:.3px}
  #calcHead i{font-style:normal;opacity:.75;font-size:12px;font-weight:400}
  #calcClose{border:0;background:rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:16px;line-height:1}
  #calcClose:hover{background:rgba(255,255,255,.35)}
  #cDisp{padding:10px 14px 6px;text-align:right;background:var(--hover);min-height:84px;display:flex;flex-direction:column;justify-content:flex-end}
  #cExpr{color:var(--muted);font-size:14px;min-height:20px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  #cExpr::-webkit-scrollbar{display:none}
  #cRes{font-size:clamp(26px,4.4dvh + 12px,38px);font-weight:600;overflow-x:auto;white-space:nowrap;line-height:1.2;scrollbar-width:none}
  #cRes::-webkit-scrollbar{display:none}
  #cRes.err{color:#e04646}
  #cKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;overflow-y:auto}
  .ck{height:clamp(34px,6.3dvh,52px);border:0;border-radius:10px;background:var(--hover);color:var(--ink);font-size:clamp(15px,2.6dvh + 4px,19px);cursor:pointer;transition:transform .08s,filter .15s}
  .ck:hover{filter:brightness(.96)}
  .ck:active{transform:scale(.94)}
  .ck.op{background:var(--brand2);color:var(--brand);font-weight:700}
  .ck.fn{background:var(--line)}
  .ck.eq{background:var(--brand);color:#fff;font-weight:700}
  .ck.w2{grid-column:span 2}
  .ck.ins{grid-column:span 4;height:clamp(32px,5.4dvh,42px);font-size:14px;background:transparent;border:1px dashed var(--brand);color:var(--brand);font-weight:600}


  /* ================= ICONS ================= */
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
  .btn:not(.menu){display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .btn.menu{align-items:center;justify-content:center}
  #tb button{display:inline-flex;align-items:center;justify-content:center}
  .brand i .ic{width:16px;height:16px}
  .doc .x{display:inline-flex}
  .doc .x .ic{width:16px;height:16px}
  .ck .ic{width:22px;height:22px}
  #calcClose{display:grid;place-items:center}
  #calcClose .ic{width:16px;height:16px}
  .ck.ins{display:flex;align-items:center;justify-content:center;gap:8px}
  .ck.ins .ic{width:17px;height:17px}
  .dd-menu button .ic{width:16px;height:16px}

  /* ================= INSERT-TABLE DIALOG ================= */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .modal .box{width:min(400px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .modal h3{margin:0 0 12px;font-size:17px}
  #tblPick{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;touch-action:none;margin-bottom:8px;user-select:none;-webkit-user-select:none}
  #tblPick i{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
  #tblPick i.on{background:var(--brand2);border-color:var(--brand)}
  #tblLbl{text-align:center;color:var(--muted);margin-bottom:12px;font-size:13px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .fields label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}
  .fields input{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--panel);font-size:16px;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .acts{display:flex;justify-content:flex-end;gap:8px}

  /* ================= TABLE TOOLS (move / resize like Word) ================= */
  #canvas{position:relative}
  #tblUI{position:absolute;left:0;top:0;width:0;height:0;z-index:25}
  #tblUI .hd{position:absolute;width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:none;user-select:none;-webkit-user-select:none}
  #tblUI .hd .ic{width:15px;height:15px}
  #tblMove,#tblRz{z-index:3}
  .grip{z-index:1}
  #tblMove{cursor:grab}
  #tblRz{width:18px;height:18px;border-radius:50%;border:2px solid #fff;cursor:nwse-resize}
  #tblBar{position:absolute;display:flex;align-items:center;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
  #tblBar button{width:34px;height:34px;border:0;background:transparent;border-radius:7px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  #tblBar button:hover{background:var(--hover)}
  #tblBar button.danger:hover{color:#d33}
  #tblBar .sep{height:24px;margin:0 3px}
  .grip{position:absolute;touch-action:none}
  .grip.c{width:14px;cursor:col-resize}
  .grip.r{height:14px;cursor:row-resize}
  .grip::after{content:"";position:absolute;background:var(--brand);opacity:0;transition:opacity .15s}
  .grip.c::after{left:6px;width:2px;top:0;bottom:0}
  .grip.r::after{top:6px;height:2px;left:0;right:0}
  .grip:hover::after,.grip.act::after{opacity:.9}
  #tblUI.dragging .grip,#tblUI.dragging #tblBar,#tblUI.dragging #tblRz{display:none}
  #dropLine{position:absolute;height:3px;background:var(--brand);border-radius:2px;display:none;z-index:26;pointer-events:none}
  #page table.moving{opacity:.4}
  @media (pointer:coarse){
    .grip.c{width:24px}.grip.r{height:24px}
    .grip.c::after{left:11px;opacity:.35}.grip.r::after{top:11px;opacity:.35}
    #tblUI .hd{width:34px;height:34px}#tblRz{width:26px;height:26px}
  }
  @media (max-width:600px){ .btn .lbl{display:none} .btn:not(.menu):not(.primary){padding:0 10px} }

  /* ================= PDF VIEWER (read only) ================= */
  #pdfView{position:fixed;inset:0;z-index:85;background:var(--bg);display:none;flex-direction:column}
  #pdfView.open{display:flex}
  #pdfBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  #pdfName{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ro{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
  .ro .ic{width:13px;height:13px}
  #pdfScroll{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;-webkit-overflow-scrolling:touch;user-select:none;-webkit-user-select:none}
  .pg{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);flex:none;margin:0 auto}
  .pg canvas{display:block}
  @media (max-width:600px){ #pdfInfo{display:none} #pdfScroll{padding:8px} }
  @media print{ #pdfView{display:none!important} }

  /* ================= TABLET (≤ 1024) ================= */
  @media (max-width:1024px){
    aside{width:210px}
    #canvas{padding:20px 12px 32px}
  }
  /* ================= SIDEBAR AS DRAWER (≤ 900) ================= */
  @media (max-width:900px){
    .menu{display:inline-flex;align-items:center;justify-content:center;width:36px;padding:0}
    #status{display:none}
    #status2{display:inline}
    aside{position:absolute;z-index:40;left:0;top:0;bottom:0;width:min(290px,84vw);transform:translateX(-104%);transition:transform .25s;box-shadow:8px 0 30px rgba(0,0,0,.3)}
    aside.open{transform:none}
    #scrim{position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.4);display:block;opacity:0;pointer-events:none;transition:opacity .25s}
    #scrim.show{opacity:1;pointer-events:auto}
    #page{padding:18mm 14mm;min-height:240mm}
  }
  /* ================= PHONE (≤ 600) ================= */
  @media (max-width:600px){
    header{flex-wrap:wrap;gap:6px;padding:8px 10px}
    .brand span{display:none}
    #title{order:10;flex:1 1 100%;max-width:none;border-color:var(--line)}
    .btn{height:36px;padding:0 11px}
    #tb{flex-wrap:nowrap;overflow-x:auto;padding:5px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    #tb::-webkit-scrollbar{display:none}
    #tb button,#tb select{height:36px;min-width:36px;flex:none}
    .clr{width:36px;height:36px}
    #canvas{padding:0 0 24px;background:var(--page)}
    #page{width:100%;box-shadow:none;padding:18px 16px;min-height:100%;font-size:16px}
    footer{padding:5px 12px calc(5px + var(--safe-b));font-size:11px}
    #toast{bottom:calc(70px + var(--safe-b))}
  }
  /* very small phones */
  @media (max-width:360px){
    .btn{padding:0 9px}
    #font{width:120px}
  }
  /* landscape phones / short screens */
  @media (max-height:480px){
    header{padding:4px 10px}
    .btn,#tb button,#tb select{height:30px}
    #tb{padding:3px 8px}
    #page{min-height:100%}
  }
  /* touch devices: bigger tap targets */
  @media (pointer:coarse){
    #tb button,#tb select{min-height:36px}
    .doc{padding:12px 10px}
  }

  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.2px;color:var(--brand);white-space:nowrap}
.brand-logo{height:32px;width:auto;max-width:140px;object-fit:contain;display:block;border-radius: 5px;}
@media (max-width:600px){ .brand-logo{height:28px} }

  /* ================= PRINT / SAVE AS PDF ================= */
  @page{size:A4;margin:0}
  @media print{
    html,body{height:auto;background:#fff;display:block}
    header,#tb,aside,#scrim,footer,#toast,#calc{display:none!important}
    main,#canvas{display:block;padding:0;overflow:visible;background:#fff}
    #page{box-shadow:none;width:auto;max-width:none;min-height:0;padding:20mm;margin:0}
    #page table,#page img{break-inside:avoid}
  }
</style>
</head>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const page = $('#page'), titleEl = $('#title');
const fontEl = $('#font'), sizeEl = $('#size'), blockEl = $('#block');
const KEY = 'new111:docs', CUR = 'new111:current', CPOS = 'new111:calcpos';

let docs = {}, cur = null, dirty = false, timer = 0;

/* ======================================================================
   Font & size dropdowns: real fonts/sizes, previewed, always in sync
   ====================================================================== */
const FONTS = ['Georgia', 'Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Trebuchet MS', 'Tahoma', 'Garamond', 'Palatino Linotype', 'Comic Sans MS'];
const SIZES = [8, 9, 10, 11, 12, 14, 16, 18, 20, 24, 28, 32, 36, 48, 60, 72];
FONTS.forEach(f => { const o = new Option(f, f); o.style.fontFamily = `"${f}"`; fontEl.add(o); });
SIZES.forEach(s => sizeEl.add(new Option(s, s)));
fontEl.value = 'Georgia'; sizeEl.value = '16';

function setSelect(el, val, isSize) {
  el.querySelectorAll('option.dyn').forEach(o => o.remove());
  let o = [...el.options].find(x => x.value.toLowerCase() === String(val).toLowerCase());
  if (!o) {                                   // value not in the list (e.g. pasted text): show it anyway
    o = new Option(val, val); o.className = 'dyn';
    if (isSize) { const after = [...el.options].find(x => +x.value > +val); el.add(o, after || null); }
    else { o.style.fontFamily = `"${val}"`; el.add(o, 0); }
  }
  el.value = o.value;
}
let lastRange = null;
function selNode() {
  const s = getSelection();
  let n = null;
  if (s.rangeCount && page.contains(s.anchorNode)) n = s.anchorNode;
  else if (lastRange && page.contains(lastRange.startContainer)) n = lastRange.startContainer;
  if (!n) n = page;
  return n.nodeType === 3 ? n.parentElement : n;
}
function syncFont() {
  const n = selNode(), cs = getComputedStyle(n);
  const family = cs.fontFamily.split(',')[0].replace(/["']/g, '').trim();
  const size = Math.round(parseFloat(cs.fontSize));
  if (document.activeElement !== fontEl) setSelect(fontEl, family, false);
  if (document.activeElement !== sizeEl) setSelect(sizeEl, size, true);
}
function restore() {                          // bring focus + the user's selection back to the page
  page.focus();
  const s = getSelection();
  if (lastRange && page.contains(lastRange.startContainer)) { s.removeAllRanges(); s.addRange(lastRange); }
  else if (!s.rangeCount || !page.contains(s.anchorNode)) {
    const r = document.createRange(); r.selectNodeContents(page); r.collapse(false); s.removeAllRanges(); s.addRange(r);
  }
}
document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if (s.rangeCount && page.contains(s.anchorNode)) {
    lastRange = s.getRangeAt(0).cloneRange();
    syncToolbar();
    trackTable();
  }
});

/* ---------- storage ---------- */
function loadAll() {
  try { docs = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { docs = {}; }
  cur = localStorage.getItem(CUR);
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(docs)); localStorage.setItem(CUR, cur || ''); return true; }
  catch (e) { setStatus('Storage full – export your work'); toast('Browser storage is full. Save your file or remove images.'); return false; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(msg) {
  const t = $('#toast'); if (!t) return; t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}
function setStatus(s) { $('#status').textContent = s; $('#status2').textContent = ' · ' + s; }

/* ---------- documents ---------- */
function saveNow() {
  clearTimeout(timer);
  if (!cur || !docs[cur]) return;
  const d = docs[cur];
  d.html = page.innerHTML; d.title = titleEl.value.trim() || 'Untitled document'; d.updated = Date.now();
  if (persist()) {
    dirty = false;
    setStatus('Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    renderList();
  }
}
function scheduleSave() {
  dirty = true; setStatus('Saving…');
  clearTimeout(timer); timer = setTimeout(saveNow, 500);
  updateCount();
}
function show(id) {
  if (cur && dirty) saveNow();
  cur = id;
  const d = docs[id];
  page.innerHTML = d.html || '';
  titleEl.value = d.title;
  document.title = d.title + ' – NeW 111';
  localStorage.setItem(CUR, cur);
  lastRange = null;
  setActive(null); renderList(); updateCount(); syncFont(); dirty = false;
  $('#canvas').scrollTop = 0;
  closeDrawer();
}
function newDoc(html, title) {
  if (cur && dirty) saveNow();
  const id = uid();
  docs[id] = { id, title: title || 'Untitled document', html: html || '', updated: Date.now() };
  persist(); show(id);
  setStatus('New document');
  if (matchMedia('(pointer:fine)').matches) page.focus();
}
function deleteDoc(id) {
  if (!confirm('Delete "' + docs[id].title + '"? This cannot be undone.')) return;
  delete docs[id];
  const ids = Object.keys(docs);
  if (!ids.length) { cur = null; newDoc(); return; }
  if (id === cur) { cur = null; ids.sort((a, b) => docs[b].updated - docs[a].updated); show(ids[0]); }
  persist(); renderList();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function renderList() {
  const ids = Object.keys(docs).sort((a, b) => docs[b].updated - docs[a].updated);
  $('#list').innerHTML = ids.map(id => {
    const d = docs[id];
    const when = new Date(d.updated).toLocaleDateString([], { day: 'numeric', month: 'short' });
    return `<div class="doc${id === cur ? ' on' : ''}" data-id="${id}"><div><b>${esc(d.title)}</b><small>${when}</small></div><button class="x" data-del="${id}" title="Delete" aria-label="Delete"><svg class="ic"><use href="#i-trash"/></svg></button></div>`;
  }).join('');
}
function updateCount() {
  const t = page.innerText.replace(/[ ​]/g, ' ').trim();
  const words = t ? t.split(/\s+/).length : 0;
  $('#count').textContent = words + ' word' + (words === 1 ? '' : 's') + ' · ' + t.length + ' characters';
}
function closeDrawer() { $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); }
function toggleDrawer() { $('#side').classList.toggle('open'); $('#scrim').classList.toggle('show', $('#side').classList.contains('open')); }

/* ---------- editing commands ---------- */
document.execCommand('styleWithCSS', false, false);
document.execCommand('defaultParagraphSeparator', false, 'p');
function cmd(c, v) { restore(); document.execCommand(c, false, v); lastRange = getSelection().rangeCount ? getSelection().getRangeAt(0).cloneRange() : lastRange; scheduleSave(); syncToolbar(); }
$('#tb').addEventListener('mousedown', e => { if (!e.target.closest('select,input')) e.preventDefault(); });   // keep the text selection
$('#tb').addEventListener('click', e => { const b = e.target.closest('button[data-cmd]'); if (b) cmd(b.dataset.cmd); });
blockEl.addEventListener('change', e => cmd('formatBlock', e.target.value === 'p' ? 'P' : e.target.value.toUpperCase()));
fontEl.addEventListener('change', e => { cmd('fontName', e.target.value); syncFont(); });
sizeEl.addEventListener('change', e => applySize(+e.target.value));
function applySize(px) {
  restore();
  const s = getSelection(); if (!s.rangeCount) return;
  const r = s.getRangeAt(0);
  if (r.collapsed) {                                   // no selection: size for the text typed next
    const span = document.createElement('span'); span.style.fontSize = px + 'px';
    const t = document.createTextNode('​'); span.appendChild(t); r.insertNode(span);
    const nr = document.createRange(); nr.setStart(t, 1); nr.collapse(true); s.removeAllRanges(); s.addRange(nr);
  } else {
    document.execCommand('fontSize', false, '7');
    const made = [];
    page.querySelectorAll('font[size="7"]').forEach(f => {
      const sp = document.createElement('span'); sp.style.fontSize = px + 'px';
      while (f.firstChild) sp.appendChild(f.firstChild);
      sp.querySelectorAll('[style]').forEach(x => { x.style.fontSize = ''; });
      f.replaceWith(sp); made.push(sp);
    });
    if (made.length) { const nr = document.createRange(); nr.setStartBefore(made[0]); nr.setEndAfter(made[made.length - 1]); s.removeAllRanges(); s.addRange(nr); }
  }
  if (s.rangeCount) lastRange = s.getRangeAt(0).cloneRange();
  scheduleSave(); syncFont();
}
function colorCmd(c, v) { document.execCommand('styleWithCSS', false, true); cmd(c, v); document.execCommand('styleWithCSS', false, false); }
$('#fore').addEventListener('input', e => { e.target.parentNode.style.setProperty('--c', e.target.value); colorCmd('foreColor', e.target.value); });
$('#back').addEventListener('input', e => { e.target.parentNode.style.setProperty('--c', e.target.value); colorCmd('hiliteColor', e.target.value); });
$('#linkBtn').addEventListener('click', () => {
  let url = prompt('Link address (https://…):', 'https://');
  if (!url || url === 'https://') return;
  if (!/^(https?:|mailto:|tel:)/i.test(url)) url = 'https://' + url;
  restore();
  const sel = getSelection();
  if (sel.isCollapsed) document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`);
  else document.execCommand('createLink', false, url);
  scheduleSave();
});
$('#tableBtn').addEventListener('click', openTblDlg);
$('#imgBtn').addEventListener('click', () => $('#imgFile').click());
$('#imgFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 1000 / img.width);
    const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    restore(); document.execCommand('insertImage', false, c.toDataURL('image/jpeg', .85)); scheduleSave();
  };
  img.src = url;
});
function syncToolbar() {
  document.querySelectorAll('#tb button[data-cmd]').forEach(b => {
    let on = false; try { on = document.queryCommandState(b.dataset.cmd); } catch (e) { }
    if (/^(undo|redo|removeFormat|indent|outdent)$/.test(b.dataset.cmd)) on = false;
    b.classList.toggle('on', on);
  });
  try {
    const b = (document.queryCommandValue('formatBlock') || '').toLowerCase();
    if (document.activeElement !== blockEl) blockEl.value = ['h1', 'h2', 'h3', 'blockquote'].includes(b) ? b : 'p';
  } catch (e) { }
  syncFont();
}
page.addEventListener('input', scheduleSave);
page.addEventListener('paste', e => {
  const html = e.clipboardData.getData('text/html'), text = e.clipboardData.getData('text/plain');
  if (!html) return;
  e.preventDefault();

/* ======================================================================

const MAX_DOCX = 2 * 1024 * 1024;        // editable Word files: 2 MB
const MAX_PDF = 15 * 1024 * 1024;        // read-only PDFs: 15 MB
const MAX_HTML = 1500000;                // converted document must fit the browser's storage
const mb = n => (n / 1048576).toFixed(1) + ' MB';

async function loadFirst(check, urls) {
  if (check()) return null;
  for (const u of urls) { try { await loadScript(u); if (check()) return u; } catch (e) { /* try next */ } }
  throw new Error('library not available');
}
function cleanHtml(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll('script,style,meta,link,iframe,object,embed,xml').forEach(n => n.remove());
  d.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); });
    n.removeAttribute('class'); n.removeAttribute('id');

}
async function openDocx(f, base) {
  if (f.size > MAX_DOCX) return toast('This Word file is ' + mb(f.size) + '. Editable files are limited to ' + mb(MAX_DOCX) + ' to keep the layout and editing smooth.');
  toast('Opening Word file…');
  try {
    await loadFirst(() => window.mammoth, ['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', 'https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js']);
    const buf = await f.arrayBuffer();
    let r = await mammoth.convertToHtml({ arrayBuffer: buf }), html = r.value, note = '';
    if (html.length > MAX_HTML) {                                   // too heavy: drop pictures
      r = await mammoth.convertToHtml({ arrayBuffer: buf }, { convertImage: mammoth.images.imgElement(() => Promise.resolve({ src: '' })) });
      html = r.value.replace(/<img[^>]*src=""[^>]*>/g, ''); note = ' Images were removed to keep it light.';
    }
    if (html.length > MAX_HTML) return toast('This document has too much content to edit here. Try a shorter file.');
    if (!html.trim()) return toast('No readable text found in this Word file.');
    newDoc(cleanHtml(html), base);
    toast('Opened ' + f.name + (r.messages.length ? ' – some complex formatting was simplified.' : '.') + note);
  } catch (err) { console.error(err); toast('Could not read this Word file. Check your internet connection and try again.'); }
}

  toast('Opening PDF…');
  try {
    const used = await loadFirst(() => window.pdfjsLib, ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js']);
    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = (used || 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js').replace('pdf.min.js', 'pdf.worker.min.js');
    const buf = await f.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    $('#pdfName').textContent = f.name; pdfZoom = 1;
    pv.classList.add('open'); await buildPdf();
  } catch (err) {
    console.error(err);
    toast(err && err.name === 'PasswordException' ? 'This PDF is password protected.' : 'Could not open this PDF. Check your internet connection and try again.');
  }
}
async function buildPdf() {
  if (pio) pio.disconnect();
  ps.innerHTML = '';
  const first = await pdfDoc.getPage(1), v1 = first.getViewport({ scale: 1 });
  const fit = Math.max(200, Math.min(ps.clientWidth - 28, 900)), scale = fit / v1.width * pdfZoom;
  $('#pdfInfo').textContent = pdfDoc.numPages + (pdfDoc.numPages === 1 ? ' page' : ' pages') + ' · ' + Math.round(pdfZoom * 100) + '%';
  pio = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting && !en.target.dataset.done) { en.target.dataset.done = '1'; drawPage(en.target, scale); }
  }), { root: ps, rootMargin: '700px 0px' });
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const d = document.createElement('div'); d.className = 'pg'; d.dataset.n = i;
    d.style.width = v1.width * scale + 'px'; d.style.height = v1.height * scale + 'px';
    ps.appendChild(d); pio.observe(d);
  }
}
async function drawPage(div, scale) {
  const page = await pdfDoc.getPage(+div.dataset.n), vp = page.getViewport({ scale });
  const dpr = Math.min(window.devicePixelRatio || 1, 2), c = document.createElement('canvas');
  c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
  c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
  div.style.width = vp.width + 'px'; div.style.height = vp.height + 'px'; div.appendChild(c);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
}
function zoomPdf(d) { pdfZoom = Math.min(3, Math.max(.5, pdfZoom + d)); if (pdfDoc) buildPdf(); }
function closePdf() { pv.classList.remove('open'); if (pio) pio.disconnect(); ps.innerHTML = ''; if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; } }
$('#pdfIn').addEventListener('click', () => zoomPdf(.25));
$('#pdfOut').addEventListener('click', () => zoomPdf(-.25));
$('#pdfClose').addEventListener('click', closePdf);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pv.classList.contains('open')) closePdf(); });

/* route a chosen file by its real type */
async function openAny(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase(), base = f.name.replace(/\.[^.]+$/, '');
  const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());
  const zip = head[0] === 0x50 && head[1] === 0x4B, ole = head[0] === 0xD0 && head[1] === 0xCF, pdf = head[0] === 0x25 && head[1] === 0x50;
  if (ext === 'pdf' || pdf) { openPdf(f); return true; }
  if (ext === 'docx' || (ext === 'doc' && zip)) { openDocx(f, base); return true; }
  if (ext === 'doc' && ole) { toast('This is an old Word 97-2003 .doc file. Open it in Word and save it as .docx, then open it here.'); return true; }
  return false;
}

/* ---------- open file ---------- */
$('#openBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (await openAny(f)) return;
  const text = await f.text();
  const base = f.name.replace(/\.[^.]+$/, '');
  let html;
  if (/\.(html?|doc)$/i.test(f.name) && /<\w+[^>]*>/.test(text)) {
    const d = new DOMParser().parseFromString(text, 'text/html');
    d.querySelectorAll('script,style,meta,link,iframe,object,xml').forEach(n => n.remove());
    d.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
    }));
    html = d.body.innerHTML;
  } else {
    html = text.replace(/\r\n/g, '\n').split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
  }
  newDoc(html, base);
  toast('Opened ' + f.name);
});

/* ---------- sidebar + buttons ---------- */
$('#newBtn').addEventListener('click', () => newDoc());
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); toggleDrawer(); });
$('#scrim').addEventListener('click', closeDrawer);
$('#list').addEventListener('click', e => {
  const x = e.target.closest('[data-del]');
  if (x) { e.stopPropagation(); return deleteDoc(x.dataset.del); }
  const d = e.target.closest('.doc');
  if (d && d.dataset.id !== cur) show(d.dataset.id); else closeDrawer();
});

/* ======================================================================
   Calculator – click and drag the blue title bar to move it (mouse or touch)
   ====================================================================== */
const calc = $('#calc'), head = $('#calcHead'), cExpr = $('#cExpr'), cRes = $('#cRes');
let ex = '', justEq = false, errTimer = 0;

function evalExpr(src) {
  let s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  if (!s.trim()) return null;
  const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
  s = s.replace(/[+\-*/]+$/, '');
  if (open > 0) s += ')'.repeat(open);
  let i = 0;
  const peek = () => s[i];
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const o = s[i++]; const t = term(); v = o === '+' ? v + t : v - t; } return v; }
  function term() { let v = unary(); while (peek() === '*' || peek() === '/') { const o = s[i++]; const t = unary(); v = o === '*' ? v * t : v / t; } return v; }
  function unary() { if (peek() === '-') { i++; return -unary(); } if (peek() === '+') { i++; return unary(); } return post(); }
  function post() { let v = prim(); while (peek() === '%') { i++; v /= 100; } return v; }
  function prim() {
    if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; }
    const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
    if (!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  }
  try { const v = expr(); return (i === s.length && isFinite(v)) ? v : null; } catch (e) { return null; }
}
const fmtNum = v => String(parseFloat(v.toPrecision(12)));
function renderCalc() {
  cExpr.textContent = ex;
  cExpr.scrollLeft = cExpr.scrollWidth;
  cRes.classList.remove('err');
  if (!ex) { cRes.textContent = '0'; return; }
  const v = evalExpr(ex);
  cRes.textContent = v === null ? (/^[\d.]*$/.test(ex) ? ex : '…') : fmtNum(v);
  if (/^[\d.]*$/.test(ex)) cRes.textContent = ex;
  cRes.scrollLeft = cRes.scrollWidth;
}
function calcError() {
  cRes.textContent = 'Error'; cRes.classList.add('err');
  clearTimeout(errTimer); errTimer = setTimeout(renderCalc, 1100);
}
function press(k) {
  if (k === 'C') { ex = ''; justEq = false; }
  else if (k === '⌫') { ex = justEq ? '' : ex.slice(0, -1); justEq = false; }
  else if (k === '=') {
    const v = evalExpr(ex);
    if (v === null) return ex ? calcError() : undefined;
    ex = fmtNum(v); justEq = true;
  }
  else if (k === '√' || k === 'x²') {
    const v = evalExpr(ex);
    if (v === null) return calcError();
    const r = k === '√' ? Math.sqrt(v) : v * v;
    if (!isFinite(r)) return calcError();
    ex = fmtNum(r); justEq = true;
  }
  else {
    const isOp = '+−×÷'.includes(k), isNum = /[0-9.]/.test(k);
    if (justEq && (isNum || k === '(')) ex = '';
    justEq = false;
    if (isOp) {
      if (!ex && k !== '−') return;
      if (/[+−×÷\-]$/.test(ex)) ex = ex.slice(0, -1);
    }
    if (k === '.' && (ex.split(/[+−×÷\-()%]/).pop() || '').includes('.')) return;
    if (k === '%' && (!ex || /[+−×÷\-(]$/.test(ex))) return;
    ex += k;
  }
  renderCalc();
}
$('#cKeys').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
$('#cIns').addEventListener('click', () => {
  const v = evalExpr(ex);
  const text = v === null ? (ex || '') : fmtNum(v);
  if (!text) return toast('Nothing to insert yet');
  restore(); document.execCommand('insertText', false, text); scheduleSave();
  toast('Inserted ' + text);
});
calc.addEventListener('keydown', e => {
  const k = e.key;
  const map = { '*': '×', '/': '÷', '-': '−', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Delete': 'C', 'c': 'C', 'C': 'C' };
  if (k === 'Escape') { toggleCalc(false); return; }
  if (/^[0-9.+()%]$/.test(k)) { e.preventDefault(); press(k); }
  else if (map[k]) { e.preventDefault(); press(map[k]); }
});

/* ----- open / close / drag ----- */
const clampPos = (x, y) => {
  const w = calc.offsetWidth, h = calc.offsetHeight;
  return [Math.min(Math.max(8, x), Math.max(8, innerWidth - w - 8)), Math.min(Math.max(8, y), Math.max(8, innerHeight - h - 8))];
};
function placeCalc(x, y) { const [cx, cy] = clampPos(x, y); calc.style.left = cx + 'px'; calc.style.top = cy + 'px'; return [cx, cy]; }
function toggleCalc(force) {
  const open = force === undefined ? !calc.classList.contains('open') : force;
  calc.classList.toggle('open', open);
  $('#calcBtn').classList.toggle('on', open);
  if (open) {
    let pos = null; try { pos = JSON.parse(localStorage.getItem(CPOS) || 'null'); } catch (e) { }
    if (pos) placeCalc(pos.x, pos.y);
    else placeCalc(innerWidth - calc.offsetWidth - 16, innerHeight - calc.offsetHeight - 70);
    renderCalc();
    if (matchMedia('(pointer:fine)').matches) calc.focus({ preventScroll: true });
  }
}
$('#calcBtn').addEventListener('click', e => { e.stopPropagation(); toggleCalc(); });
$('#calcClose').addEventListener('click', () => toggleCalc(false));
let drag = null;
head.addEventListener('pointerdown', e => {
  if (e.target.closest('#calcClose')) return;
  const r = calc.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  head.setPointerCapture(e.pointerId); head.classList.add('drag');
});
head.addEventListener('pointermove', e => { if (drag) placeCalc(e.clientX - drag.dx, e.clientY - drag.dy); });
const endDrag = e => {
  if (!drag) return;
  drag = null; head.classList.remove('drag');
  try { localStorage.setItem(CPOS, JSON.stringify({ x: parseFloat(calc.style.left), y: parseFloat(calc.style.top) })); } catch (er) { }
};
head.addEventListener('pointerup', endDrag);
head.addEventListener('pointercancel', endDrag);
addEventListener('resize', () => { if (calc.classList.contains('open')) placeCalc(parseFloat(calc.style.left) || 0, parseFloat(calc.style.top) || 0); });
addEventListener('orientationchange', () => setTimeout(() => { if (calc.classList.contains('open')) placeCalc(parseFloat(calc.style.left) || 0, parseFloat(calc.style.top) || 0); }, 250));

/* ---------- shortcuts, safety ---------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); toast('Saved'); }
});
addEventListener('beforeunload', () => { if (dirty) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) saveNow(); });
addEventListener('pagehide', () => { if (dirty) saveNow(); });
addEventListener('storage', e => { if (e.key === KEY && !dirty) { loadAll(); renderList(); } });

/* ---------- start ---------- */
loadAll();
if (cur && docs[cur]) show(cur);
else {
  const ids = Object.keys(docs);
  if (ids.length) { ids.sort((a, b) => docs[b].updated - docs[a].updated); show(ids[0]); }
  else newDoc('<h1>Welcome to NeW 111</h1><p>Start typing here. Your work is <b>saved automatically</b> in this browser.</p><p>Use <b>New</b> for a blank document, <b>Open</b> to edit a .txt, .html, .doc or .docx file (PDFs open read-only), <b>Save as</b> to export to PDF, Word, text or HTML, and the <b>Calculator</b> button for a calculator you can drag anywhere.</p>', 'Welcome');
}
syncFont();
})();
</script>
